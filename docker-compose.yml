services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: internship_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d internship_project"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/internship_project?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/internship_project?schema=public
      JWT_SECRET: change-this-access-secret
      REFRESH_TOKEN_SECRET: change-this-refresh-secret
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      COOKIE_SECURE: "false"
      FRONTEND_URL: http://localhost:8080
    ports:
      - "5000:5000"
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  backend-uploads:
